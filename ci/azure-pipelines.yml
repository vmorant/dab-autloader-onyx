# CI/CD for the ingestion bundle (Azure DevOps).
#
#   PR to main → tests
#   main       → tests → dev (wheel + deploy + e2e) → pre (approval) → pro (approval)
#
# Requirements (see docs/DEPLOYMENT.md, 2.7):
#   - ARM service connections with workload identity federation, one per environment:
#       sc-odp-datateam01-dev | -pre | -pro  → svc-dbks-datateam01-<env>-deploy
#   - Variable groups odp-datateam01-<env> with DATABRICKS_HOST.
#   - Environments odp-datateam01-pre and -pro with manual approval.
#   - Egress to PyPI and GitHub from the agent (uv, databricks-bundles, CLI). If the
#     AXA pool does not have it, use the internal artifact feed instead.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

variables:
  DATABRICKS_CLI_VERSION: "1.21.0"      # keep aligned with databricks-bundles (pyproject.toml)
  UV_VERSION: "0.11.32"

pool:
  vmImage: ubuntu-latest                 # or the platform's self-hosted pool

stages:
  - stage: test
    displayName: Tests
    jobs:
      - job: unit
        displayName: pytest (framework logic and bundle generation)
        steps:
          - template: steps-setup.yml
          - script: uv run pytest -q --junitxml=$(Build.ArtifactStagingDirectory)/pytest.xml
            displayName: pytest
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: $(Build.ArtifactStagingDirectory)/pytest.xml

  # dev: the CI deployment uses its own prefix (dev_<sp>_...) and does not clash
  # with developers. The e2e is the gate to move on to pre.
  - template: deploy-stage.yml
    parameters:
      env: dev
      dependsOn: [test]
      runE2E: true

  - template: deploy-stage.yml
    parameters:
      env: pre
      dependsOn: [deploy_dev]

  - template: deploy-stage.yml
    parameters:
      env: pro
      dependsOn: [deploy_pre]
