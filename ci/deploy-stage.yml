# Deployment stage for one environment: wheel (idempotent) → validate → deploy [→ e2e].
#
# No --auto-approve: if a deploy would delete or recreate a schema or a Volume
# (loss of data or checkpoints), the CLI stops and the pipeline fails.
# That change is reviewed and applied by hand.
parameters:
  - name: env
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: runE2E
    type: boolean
    default: false

stages:
  - stage: deploy_${{ parameters.env }}
    displayName: Deploy ${{ parameters.env }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: odp-datateam01-${{ parameters.env }}      # DATABRICKS_HOST
    jobs:
      - deployment: deploy
        displayName: Bundle ${{ parameters.env }}
        environment: odp-datateam01-${{ parameters.env }}   # approvals in pre and pro
        timeoutInMinutes: 180
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: steps-setup.yml

                - task: AzureCLI@2
                  displayName: Wheel, validate and deploy (${{ parameters.env }})
                  inputs:
                    azureSubscription: sc-odp-datateam01-${{ parameters.env }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      export DATABRICKS_HOST="$(DATABRICKS_HOST)"
                      export DATABRICKS_AUTH_TYPE=azure-cli     # token of the service connection's SP
                      scripts/publish_wheel.sh ${{ parameters.env }}
                      databricks bundle validate -t ${{ parameters.env }}
                      databricks bundle deploy -t ${{ parameters.env }}
                      databricks bundle summary -t ${{ parameters.env }}

                - ${{ if parameters.runE2E }}:
                    - task: AzureCLI@2
                      displayName: e2e (CLEX simulator)
                      timeoutInMinutes: 150
                      inputs:
                        azureSubscription: sc-odp-datateam01-${{ parameters.env }}
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          export DATABRICKS_HOST="$(DATABRICKS_HOST)"
                          export DATABRICKS_AUTH_TYPE=azure-cli
                          # Waits for completion; non-zero exit code if any check fails.
                          databricks bundle run e2e_e2e_selftest -t ${{ parameters.env }}
