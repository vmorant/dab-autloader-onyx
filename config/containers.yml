# Contenedores del landing de este equipo: UNA ENTRADA = UN JOB.
#
# Dar de alta un contenedor nuevo (un custodian × una instancia de CLEX):
#   1. Añade una entrada aquí (PR aprobado por plataforma + custodian).
#   2. Al desplegar se crean su job, su pipeline de silver, sus esquemas
#      bronze/silver y su Volume odp_system. La ruta del landing sale del naming:
#      abfss://{container}@{storage_account}.dfs.core.windows.net
#   3. Las tablas NO se listan: llegan solas con los manifiestos de CLEX.
#
# Campos:
#   container          nombre del contenedor en el storage de landing (obligatorio)
#   custodian          data custodian responsable (obligatorio)
#   description, data_class
#   environments       [dev, pre, pro] — alta progresiva; sin el campo, en todos
#   storage_account    solo si el contenedor está en otra cuenta que la del target
#   readers            grupos Entra con lectura en sus esquemas (con manage_schemas)
#   registration       auto (por defecto) | manual (solo approved_entities)
#   approved_entities, disabled_entities
#   active             false = pausa: sin job; esquemas, Volume, pipeline y datos se
#                      conservan. Borrar la entrada es la baja definitiva (borra la
#                      pipeline y sus tablas de silver; el deploy pide confirmación)
#   e2e                true = además un job e2e que simula a CLEX (solo dev/pre;
#                      contenedor dedicado, ver docs/DESPLIEGUE.md)
#   ingest / pipelines / trigger / report   overrides de platform.yml

containers:
  - container: motors-sqlserver
    custodian: motors
    description: Sistemas de Motors en SQL Server (CLEX conector sqlserver)
    data_class: confidential
    readers: [grp-datateam01-motors-dbx-reader]

  - container: home-sqlserver
    custodian: home
    description: Sistemas de Home en SQL Server (misma tecnología, otro custodian)
    data_class: confidential
    readers: [grp-datateam01-home-dbx-reader]
    registration: manual            # doble aprobación: solo las tablas listadas
    approved_entities:
      - hbas_contracts

  - container: motors-oracle         # ejemplo de alta progresiva: de momento solo en dev
    custodian: motors
    description: Sistemas de Motors en Oracle (segundo CLEX del mismo custodian)
    data_class: confidential
    environments: [dev]
    ingest:
      concurrency: 4

  - container: e2e-selftest          # prueba end-to-end del framework: el job e2e simula a CLEX
    custodian: platform
    description: Contenedor de pruebas. No recibe datos reales; cada ejecución del e2e crea y borra sus tablas.
    data_class: internal
    environments: [dev]
    e2e: true
    report:
      fail_on_error: false           # el paso 3 provoca errores a propósito; los verifica el job e2e
      row_count_grace_minutes: 0     # recuentos evaluados en la misma ejecución
