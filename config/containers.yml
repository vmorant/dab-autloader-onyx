# Landing containers of this team: ONE ENTRY = ONE JOB.
#
# Onboarding a new container (one custodian × one CLEX instance):
#   1. Add an entry here (PR approved by platform + custodian).
#   2. The deploy creates its job, its silver pipeline, its bronze/silver
#      schemas and its odp_system Volume. The landing path comes from the naming:
#      abfss://{container}@{storage_account}.dfs.core.windows.net
#   3. Tables are NOT listed: they arrive on their own with the CLEX manifests.
#
# Fields:
#   container          container name in the landing storage (required)
#   custodian          responsible data custodian (required)
#   description, data_class
#   environments       [dev, pre, pro] — progressive rollout; without the field, all of them
#   storage_account    only if the container lives in another account than the target's
#   readers            Entra groups with read access on its schemas (with manage_schemas)
#   registration       auto (default) | manual (only approved_entities)
#   approved_entities, disabled_entities
#   active             false = pause: no job; schemas, Volume, pipeline and data are
#                      kept. Deleting the entry is the final removal (it deletes the
#                      pipeline and its silver tables; the deploy asks for confirmation)
#   e2e                true = also an e2e job that simulates CLEX (dev/pre only;
#                      dedicated container, see docs/TESTING_AND_OPERATIONS.md)
#   ingest / pipelines / trigger / report   overrides of platform.yml

containers:
  - container: motors-sqlserver
    custodian: motors
    description: Motors systems on SQL Server (CLEX sqlserver connector)
    data_class: confidential
    readers: [grp-datateam01-motors-dbx-reader]

  - container: home-sqlserver
    custodian: home
    description: Home systems on SQL Server (same technology, another custodian)
    data_class: confidential
    readers: [grp-datateam01-home-dbx-reader]
    registration: manual            # double approval: only the listed tables
    approved_entities:
      - hbas_contracts

  - container: motors-oracle         # progressive rollout example: dev only for now
    custodian: motors
    description: Motors systems on Oracle (second CLEX of the same custodian)
    data_class: confidential
    environments: [dev]
    ingest:
      concurrency: 4

  - container: e2e-selftest          # end-to-end test of the framework: the e2e job simulates CLEX
    custodian: platform
    description: Test container. It receives no real data; each e2e execution creates and deletes its tables.
    data_class: internal
    environments: [dev]
    e2e: true
    report:
      fail_on_error: false           # step 3 causes errors on purpose; the e2e job checks them
      row_count_grace_minutes: 0     # row counts evaluated in the same run
