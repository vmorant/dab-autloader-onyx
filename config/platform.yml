# Platform conventions (maintained by the platform team).
#
# Available templates: {team_id} {env} {env_upper} {container}
# {container_snake} {storage_account} {custodian} {data_class}

naming:
  bronze_catalog: "odp_{team_id}_{env}_bronze"      # one catalog per layer
  silver_catalog: "odp_{team_id}_{env}_silver"
  schema: "{container_snake}"                        # schema = container (isolation per custodian)
  landing_root: "abfss://{container}@{storage_account}.dfs.core.windows.net"
  job_name: "job-{team_id}-{env}-{container}-ingest"
  silver_pipeline_name: "sdp-{team_id}-{env}-{container}-silver"
  e2e_job_name: "job-{team_id}-{env}-{container}-e2e"     # only containers with e2e: true

layout:                     # contract with CLEX (see src/odp_framework/manifest.py)
  data_dir: data
  manifests_dir: _manifests
  run_partition: run_id

registration:
  mode: auto                # default when containers.yml says nothing

ingest:                     # bronze: Auto Loader in a for_each (one iteration per table)
  concurrency: 8            # tables in parallel on the shared job cluster
  min_workers: 1
  max_workers: 4
  max_retries: 1            # per table; schema changes are retried inside the task

pipelines:                  # silver (SDP), classic compute (no serverless at first)
  edition: PRO              # AUTO CDC requires PRO; ADVANCED if expectations are added
  channel: CURRENT
  photon: false
  min_workers: 1
  max_workers: 4

trigger:                    # file arrival on _manifests/
  wait_after_last_change_seconds: 300       # groups consecutive CLEX deliveries
  min_time_between_triggers_seconds: 900    # avoids starting clusters back to back

report:
  pending_alert_hours: 24        # manifest not loaded → ERROR (the landing expires)
  row_count_grace_minutes: 60    # margin before a row count is considered wrong
  lookback_days: 7               # manifests reviewed by each run
  fail_on_error: true            # the job fails (and notifies) if there are errors

tags:                       # mandatory FinOps tags (Azure Policy)
  global-Team: "{team_id}"
  global-Environment: "{env_upper}"
  global-Source: "{container}"
  global-DataClass: "{data_class}"
  Project: "ONYX"
