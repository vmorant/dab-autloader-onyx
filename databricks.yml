# ONYX Data Platform — CLEX → bronze → silver ingestion bundle of one team.
#
# One job per landing container (custodian × CLEX), generated from config/
# by resources/__init__.py (Python DABs): bronze with Auto Loader (for_each per
# table) and silver with SDP (AUTO CDC). The tables are defined by the CLEX
# manifests. See README.md.

bundle:
  name: odp-ingestion-datateam01
  databricks_cli_version: ">= 0.275.0"

python:
  venv_path: .venv
  resources:
    - "resources:load_resources"

sync:
  # Only the silver pipeline source is uploaded to the workspace; the framework
  # is installed as a versioned wheel (framework_wheel variable).
  exclude:
    - src/odp_framework/**
    - config/**            # read at deploy time; travels inside the job and the pipeline
    - tests/**
    - samples/**
    - scripts/**

variables:
  team_id:
    description: Stable teamId of the team (ODP naming)
    default: datateam01
  env:
    description: dev | pre | pro
  landing_storage_account:
    description: Landing storage account of the workspace (odp{owner}{env}lzsto{seq})
  framework_wheel:
    description: >-
      odp_framework wheel pinned for this target (path in a read-only
      Volume). Upgrading = a PR that changes this path.
  pipeline_policy_id:
    description: Cluster policy of the silver pipeline (cluster_type dlt, mandatory tags)
    default: ""
  job_policy_id:
    description: Cluster policy of the job cluster (register, per-table ingest and report)
    default: ""
  spark_version:
    description: DBR of the job cluster (bronze Auto Loader and wheel tasks)
    default: "16.4.x-scala2.12"
  notification_emails:
    description: Comma-separated emails that receive job failures
    default: ""
  file_events:
    description: >-
      true if the landing external location has file events enabled
      (requires the Access Connector roles; without them, Auto Loader lists).
    default: "false"
  manage_schemas:
    description: >-
      true: the bundle creates, per container, the bronze/silver schemas (with
      read grants for 'readers') and the odp_system Volume. Requires the deploy
      SP to have USE CATALOG and CREATE SCHEMA on the team catalogs.
    default: "true"
  run_as_sp:
    description: Application ID of the service principal that runs jobs and pipelines
    default: ""
  deploy_sp:
    description: Application ID of the CI service principal that deploys (CAN_MANAGE)
    default: ""
  team_group:
    description: Entra group of the team (read permission on jobs and pipelines)
    default: grp-datateam01-dbx-reader

targets:
  dev:
    # mode: development → jobs and pipelines prefixed with [dev user], paused
    # triggers and per-developer schemas (dev_<user>_<container>): each developer
    # has their own registry, bronze, silver and checkpoints; the landing is shared.
    mode: development
    default: true
    workspace:
      host: https://adb-0000000000000000.0.azuredatabricks.net   # odp-dbx-datateam01-dev
    # To test the file arrival trigger with the real CLEX in dev:
    # presets:
    #   trigger_pause_status: UNPAUSED
    variables:
      env: dev
      landing_storage_account: odpdatateam01devlzsto01
      framework_wheel: /Volumes/odp_platform_dev/libs/wheels/odp_framework-0.4.0-py3-none-any.whl

  pre:
    mode: production
    workspace:
      host: https://adb-0000000000000001.1.azuredatabricks.net   # odp-dbx-datateam01-pre
      # Deployed by the CI with svc-dbks-datateam01-pre-deploy: a single copy per target
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_sp}
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${var.deploy_sp}
      - level: CAN_VIEW
        group_name: ${var.team_group}
    variables:
      env: pre
      landing_storage_account: odpdatateam01prelzsto01
      framework_wheel: /Volumes/odp_platform_pre/libs/wheels/odp_framework-0.4.0-py3-none-any.whl
      pipeline_policy_id: "<policy-id-pipelines-pre>"
      job_policy_id: "<policy-id-jobs-pre>"
      run_as_sp: "<application-id-svc-dbks-datateam01-pre-run>"
      deploy_sp: "<application-id-svc-dbks-datateam01-pre-deploy>"

  pro:
    mode: production
    workspace:
      host: https://adb-0000000000000002.2.azuredatabricks.net   # odp-dbx-datateam01-pro
      # Deployed by the CI with svc-dbks-datateam01-pro-deploy: a single copy per target
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_sp}
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${var.deploy_sp}
      - level: CAN_VIEW
        group_name: ${var.team_group}
    variables:
      env: pro
      landing_storage_account: odpdatateam01prolzsto01
      framework_wheel: /Volumes/odp_platform_pro/libs/wheels/odp_framework-0.4.0-py3-none-any.whl
      pipeline_policy_id: "<policy-id-pipelines-pro>"
      job_policy_id: "<policy-id-jobs-pro>"
      run_as_sp: "<application-id-svc-dbks-datateam01-pro-run>"
      deploy_sp: "<application-id-svc-dbks-datateam01-pro-deploy>"
      notification_emails: "<team-mailbox@axa-partners.com>"
