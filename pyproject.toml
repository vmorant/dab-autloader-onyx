[project]
name = "odp_framework"
version = "0.4.0"
description = "ONYX Data Platform: ingesta CLEX → bronze (Auto Loader) → silver (SDP AUTO CDC), con DABs"
# Sin readme: la wheel solo cambia cuando cambia el código (publish_wheel.sh compara contenidos).
requires-python = ">=3.10"
# Runtime: nada fuera de Databricks Runtime (pyspark y databricks-sdk ya vienen).
dependencies = []

[project.scripts]
# Entry points de las tareas wheel del job (python_wheel_task).
odp-register = "odp_framework.tasks.register:entrypoint"
odp-ingest = "odp_framework.tasks.ingest:entrypoint"
odp-report = "odp_framework.tasks.report:entrypoint"
odp-e2e = "odp_framework.tasks.e2e:entrypoint"

[dependency-groups]
# Solo para el deploy (generador Python DABs) y los tests.
# Mantener databricks-bundles alineado con la versión del CLI.
dev = [
    "databricks-bundles==1.21.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odp_framework"]

[tool.hatch.build.targets.sdist]
include = ["src/odp_framework", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
