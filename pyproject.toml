[project]
name = "odp_framework"
version = "0.4.0"
description = "ONYX Data Platform: CLEX ingestion → bronze (Auto Loader) → silver (SDP AUTO CDC), with DABs"
# No readme: the wheel only changes when the code changes (publish_wheel.sh compares contents).
requires-python = ">=3.10"
# Runtime: nothing beyond Databricks Runtime (pyspark and databricks-sdk are already there).
dependencies = []

[project.scripts]
# Entry points of the job's wheel tasks (python_wheel_task).
odp-register = "odp_framework.tasks.register:entrypoint"
odp-ingest = "odp_framework.tasks.ingest:entrypoint"
odp-report = "odp_framework.tasks.report:entrypoint"
odp-e2e = "odp_framework.tasks.e2e:entrypoint"

[dependency-groups]
# Only for the deploy (Python DABs generator) and the tests.
# Keep databricks-bundles aligned with the CLI version.
dev = [
    "databricks-bundles==1.21.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odp_framework"]

[tool.hatch.build.targets.sdist]
include = ["src/odp_framework", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
